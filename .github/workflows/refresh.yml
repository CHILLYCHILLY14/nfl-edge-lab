name: Refresh model

# Free on GitHub Actions for a public repo, and comfortably inside the free
# minutes for a private one: each run takes well under a minute.
#
# Times are UTC. The schedule below is tuned for Eastern time and for how the
# NFL week actually moves:
#   12:00 UTC = 08:00 ET  morning line check, injury report lands
#   16:00 UTC = 12:00 ET  before the early Sunday kicks
#   20:00 UTC = 16:00 ET  before the late window
#   00:00 UTC = 20:00 ET  before Sunday and Monday night
#   05:00 UTC = 01:00 ET  after the late games, to grade
#
# GitHub's scheduler is best-effort and can run several minutes late. That is
# fine for a model that reads a market every few hours. Do not treat it as a
# live feed, and do not point it at a game kicking off in ten minutes.
on:
  push:
    branches: [main]
    # Source/config uploads rebuild immediately. Generated-data commits do not
    # match these paths, so the bot cannot trigger itself in a loop.
    paths:
      - ".github/workflows/refresh.yml"
      - "pipeline/**"
      - "config/**"
      - "tests/**"
      - "site/**"
      - "requirements.txt"
  schedule:
    - cron: "0 12,16,20 * * *"
    - cron: "0 0,5 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full-season backfill (slow, rebuilds the cache)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: nfl-edge-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the keyless odds parser
        run: python -m unittest tests.test_offline.TestEspnOddsParsing -v

      - name: Verify the manual browser ledger
        run: node tests/test_ledger.mjs

      - name: Run the model
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python -m pipeline.build --full
          else
            python -m pipeline.build
          fi

      # state/ has to be committed back or the model forgets everything between
      # runs: the odds snapshots that make grading and closing-line value
      # possible, plus the shadow book that tracks tier accuracy. Actual wagers
      # are manual browser-local entries and are never committed by the bot.
      - name: Commit refreshed data
        run: |
          git config user.name  "nfl-edge bot"
          git config user.email "actions@github.com"
          # Public feed/model allowlist. Browser-local wagers and the
          # financial-style shadow performance summary are never staged.
          git add -A -- \
            state/fpi_*.json state/forecasts.json state/games_*.json \
            state/lines.json state/rank_history.json \
            site/data/board.json site/data/forecasts.json site/data/games.json \
            site/data/games_detail.json site/data/injuries.json site/data/meta.json \
            site/data/news.json site/data/outlook.json site/data/ratings.json \
            site/data/simulator.json site/data/team_stats.json site/data/weather.json
          git diff --staged --quiet || git commit -m "Refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed while this one was working.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

      - name: Stage public site without financial performance history
        run: |
          mkdir -p _public_site/data
          cp -R site/. _public_site/
          printf '{}\n' > _public_site/data/performance.json

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site

  # Deploying has to be its own job with the github-pages environment declared.
  # actions/deploy-pages refuses to run without it, which is a confusing failure
  # right at the end of an otherwise successful run.
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
